[package]
name = "cleo5-dashboard"
version = "0.1.2"
edition = "2021"
description = "In-game dashboard for CLEO 5 on GTA San Andreas"
license = "MIT"
repository = "https://github.com/cleolibrary/cleo5-dashboard"

[lib]
crate-type = ["rlib", "cdylib"]
name = "sa_dashboard"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
ctor = "0.1.23"
hudhook = "0.9.3"
imgui = { version = "0.12.0", features = ["tables-api"] }
serde = {version = "1", features = ["derive"]}
serde_json = {version = "1", features = ["preserve_order"]}
log = { version = "0.4.14", features = ["max_level_trace", "release_max_level_debug"] }
simplelog = "0.11.2"
static_assertions = "1.1.0"
version-compare = "0.1"
ureq = { version = "2.9", features = ["json"] }
thiserror = "1.0"